# This workflow builds the Browserino Xcode project and runs its tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build and test
      run: xcodebuild test -project Browserino.xcodeproj -scheme Browserino -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
    - name: Check localizations
      run: python3 scripts/check-localizations.py
