# This workflow builds the Lotsen Xcode project and runs its tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    # Pinned rather than macos-latest, so a new runner image cannot change the
    # toolchain under a pull request.
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_26.6.app
    - name: Build and test
      run: xcodebuild test -project Lotsen.xcodeproj -scheme Lotsen -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
    - name: Check localizations
      run: python3 scripts/check-localizations.py
    - name: Check Homebrew cask generation
      run: python3 scripts/test-homebrew-cask.py
    # Compiles the tab-move AppleScripts against Chrome's and Safari's dictionaries
    # without running them.
    - name: Check browser scripts
      run: python3 scripts/check-browser-scripts.py && swift /tmp/lotsen-check-scripts.swift
